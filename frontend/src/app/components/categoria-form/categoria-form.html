<h2>{{ id ? 'Editar categoría' : 'Nueva categoría' }}</h2>

@if (error()) {
  <div class="alert alert-danger">{{ error() }}</div>
}

@if (cargando()) {
  <p class="text-muted">Cargando...</p>
} @else {
  <form [formGroup]="form" (ngSubmit)="guardar()">
    <div class="mb-3">
      <label class="form-label" for="nombre">Nombre</label>
      <input id="nombre" class="form-control" type="text" formControlName="nombre">
      @if (form.controls.nombre.touched && form.controls.nombre.hasError('required')) {
        <div class="text-danger small">El nombre es obligatorio</div>
      }
    </div>
    <div class="mb-3">
      <label class="form-label" for="descripcion">Descripción</label>
      <textarea id="descripcion" class="form-control" rows="3" formControlName="descripcion"></textarea>
    </div>
    <button class="btn btn-primary me-2" type="submit" [disabled]="form.invalid || guardando()">Guardar</button>
    <a class="btn btn-outline-secondary" routerLink="/categorias">Cancelar</a>
  </form>
}
